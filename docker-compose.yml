services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrape}
      POSTGRES_DB: ${POSTGRES_DB:-scrape_journal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrape} -d ${POSTGRES_DB:-scrape_journal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # .env drives this: keep the compose database url there to use the "db" service,
      # or a managed host such as Supabase (with DATABASE_SSL=true) to write there.
      DATABASE_URL: ${DATABASE_URL:-postgres://scrape:scrape@db:5432/scrape_journal}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      PORT: 3000
    ports:
      - "3000:3000"
    # Chromium crashes with Docker's default 64MB /dev/shm.
    shm_size: 1gb

  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Docker/Dockerfile-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      # .env drives this: keep the compose database url there to use the "db" service,
      # or a managed host such as Supabase (with DATABASE_SSL=true) to write there.
      DATABASE_URL: ${DATABASE_URL:-postgres://scrape:scrape@db:5432/scrape_journal}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      PORT: 3000
    ports:
      - "3000:3000"
    shm_size: 1gb
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json

volumes:
  pgdata:
