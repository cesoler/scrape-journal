name: daily-scrape

# 09:00 UTC is 06:00 in America/Sao_Paulo, after the newsroom has filled the
# home page for the day. GitHub queues scheduled runs, so the exact minute drifts.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

# Never let a slow run overlap the next day's.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The production image is the single place where Chrome's shared libraries
      # are declared, and it ships Chrome itself in a layer instead of having
      # Puppeteer download it on every run.
      - name: Build the scraper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          tags: scrape-journal:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scrape every column into the database
        run: |
          docker run --rm \
            --shm-size=1g \
            -e DATABASE_URL \
            -e DATABASE_SSL=true \
            scrape-journal:ci npm run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
